name: Build Android Release By Tag CI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Decode keystore from base64 secret
      run: |
        echo "${{ secrets.KEYSTORE_B64 }}" | base64 -di > ${{ github.workspace }}/release.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Release APK
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease --no-daemon \
          -Pandroid.injected.signing.store.file=$KEYSTORE_FILE \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD
      
    - name: Get versionName
      id: version
      run: |
        VERSION_NAME=$(grep -E "versionName" app/build.gradle.kts | head -n1 | sed -E "s/.*versionName[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\1/")
        echo "versionName=$VERSION_NAME" >> $GITHUB_OUTPUT
      
    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.version.outputs.versionName }}
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
